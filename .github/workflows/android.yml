name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Tests
        run: npm test

      # מספר הגרסה בתוך האפליקציה — כדי לדעת איזו גרסה מותקנת בטלפון
      - name: Stamp version
        run: echo "export const VERSION = 'build-${{ github.run_number }}';" > www/js/version.js

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      # מפתח חתימה קבוע מ-GitHub Secrets (SIGNING_KEYSTORE_B64) — בלעדיו כל בנייה נחתמת
      # במפתח אחר, ואנדרואיד מסרב לעדכן את האפליקציה המותקנת (והסרה מוחקת את הנתונים).
      # המפתח מועבר ל-Gradle במפורש (android.injected.signing.*): הנחה בתיקיית ברירת המחדל
      # (~/.android/debug.keystore) לא נקראה, וכל בנייה נחתמה במפתח אקראי אחר
      # Gradle נשמר במטמון של GitHub — כך שתקלה בשרת ההורדות שלו (504 לאורך דקות) לא מפילה את הבנייה.
      # גרסת bin (בלי קוד מקור ותיעוד) — קטנה יותר מ-all
      - name: Use the Gradle bin distribution
        run: sed -i 's/-all\.zip/-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}-
            gradle-${{ runner.os }}-

      - name: Use the fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vidlearn.keystore"
            keytool -list -keystore "$RUNNER_TEMP/vidlearn.keystore" -storepass android -alias androiddebugkey >/dev/null
            echo "SIGNING_ARGS=-Pandroid.injected.signing.store.file=$RUNNER_TEMP/vidlearn.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android" >> "$GITHUB_ENV"
            echo "KEY_SHA256=$(keytool -list -v -keystore "$RUNNER_TEMP/vidlearn.keystore" -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | awk '{print $2}')" >> "$GITHUB_ENV"
            echo "signing with the fixed key"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 is not set — this APK is signed with a one-off key and cannot update an installed copy"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          # הורדת Gradle נכשלת לפעמים לאורך דקות (פסק זמן / 504 משרת ההורדות ב-GitHub).
          # שני ניסיונות מהשרת הרשמי, ואז אתרי מראה — עם בדיקת SHA-256 הרשמית, כך שקובץ שונה נדחה
          PROPS=gradle/wrapper/gradle-wrapper.properties
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' $PROPS
          GV=$(sed -n 's/.*gradle-\([0-9.]*\)-bin\.zip.*/\1/p' $PROPS)
          MIRRORS=""
          if [ "$GV" = "8.11.1" ]; then
            echo "distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6" >> $PROPS
            MIRRORS="https\\://mirrors.cloud.tencent.com/gradle/gradle-$GV-bin.zip https\\://mirrors.aliyun.com/gradle/distributions/v$GV/gradle-$GV-bin.zip"
          fi
          ok=""
          for url in official official $MIRRORS; do
            if [ "$url" != official ]; then sed -i "s#^distributionUrl=.*#distributionUrl=$url#" $PROPS; echo "trying mirror $url"; fi
            if ./gradlew --version --no-daemon >/dev/null; then ok=1; break; fi
            echo "Gradle download failed, retrying"; sleep 20
          done
          [ -n "$ok" ] || { echo "::error::could not download Gradle"; exit 1; }
          ./gradlew assembleDebug --no-daemon $SIGNING_ARGS

      # ה-APK חייב להיות חתום במפתח הקבוע — אחרת הוא לא יתקין עדכון, ועדיף שהבנייה תיכשל
      - name: Verify signature
        if: env.KEY_SHA256 != ''
        run: |
          APK_SHA256=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA256:' | awk '{print $2}')
          echo "key: $KEY_SHA256"
          echo "apk: $APK_SHA256"
          [ "$APK_SHA256" = "$KEY_SHA256" ] || { echo "::error::APK is not signed with the fixed key"; exit 1; }

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VidLearn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VidLearn-apk
          path: VidLearn.apk

      # כל בנייה מ-main מתפרסמת כגרסה — קישור קבוע להורדה מהטלפון:
      # https://github.com/<owner>/vidlearn/releases/latest/download/VidLearn.apk
      - name: Release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: VidLearn ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: VidLearn.apk
