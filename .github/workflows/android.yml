name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Tests
        run: npm test

      # מספר הגרסה בתוך האפליקציה — כדי לדעת איזו גרסה מותקנת בטלפון
      - name: Stamp version
        run: echo "export const VERSION = 'build-${{ github.run_number }}';" > www/js/version.js

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      # מפתח חתימה קבוע מ-GitHub Secrets (SIGNING_KEYSTORE_B64) — בלעדיו כל בנייה נחתמת
      # במפתח אחר, ואנדרואיד מסרב לעדכן את האפליקציה המותקנת (והסרה מוחקת את הנתונים)
      - name: Use the fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "signing with the fixed key"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 is not set — this APK is signed with a one-off key and cannot update an installed copy"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          # הורדת Gradle נקטעת לפעמים אחרי 10 שניות (ברירת המחדל) — זמן ארוך יותר וניסיון חוזר
          # להורדה בלבד; הבנייה עצמה רצה פעם אחת
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3; do ./gradlew --version --no-daemon >/dev/null && break; echo "Gradle download failed (attempt $i), retrying"; sleep 10; done
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VidLearn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VidLearn-apk
          path: VidLearn.apk

      # כל בנייה מ-main מתפרסמת כגרסה — קישור קבוע להורדה מהטלפון:
      # https://github.com/<owner>/vidlearn/releases/latest/download/VidLearn.apk
      - name: Release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: VidLearn ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: VidLearn.apk
